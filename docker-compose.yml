services:
  hyperframes-studio:
    build:
      context: https://github.com/mia-corral-developer/hyperframes-studio.git#main
      dockerfile: Dockerfile
    image: hyperframes-studio:latest
    restart: unless-stopped
    # Vite's file watcher (chokidar) exhausts fds/inotify; a small nofile limit
    # made the server crash with EMFILE. Also raise the HOST limits once:
    #   sysctl -w fs.inotify.max_user_instances=2048 fs.inotify.max_user_watches=1048576
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      # Single source of truth: the SAME volume the MCP container writes to.
      # Projects authored/rendered through the MCP show up in the Studio, and
      # vice versa. The volume name is the one Docker created for the MCP
      # compose project (code_hf-mcp-projects).
      HF_PROJECTS_DIR: /app/hf/packages/studio/data/projects
    volumes:
      - hf-projects:/app/hf/packages/studio/data/projects
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network

      # HTTP → redirect to HTTPS
      - traefik.http.routers.hf-studio-web.rule=Host(`hyperframes.lab.whitelabel.lat`)
      - traefik.http.routers.hf-studio-web.entrypoints=web
      - traefik.http.routers.hf-studio-web.service=hf-studio-web
      - traefik.http.routers.hf-studio-web.middlewares=redirect-to-https@file

      # HTTPS
      - traefik.http.routers.hf-studio-websecure.rule=Host(`hyperframes.lab.whitelabel.lat`)
      - traefik.http.routers.hf-studio-websecure.entrypoints=websecure
      - traefik.http.routers.hf-studio-websecure.service=hf-studio-websecure
      - traefik.http.routers.hf-studio-websecure.tls.certresolver=letsencrypt

      # Container port
      - traefik.http.services.hf-studio-web.loadbalancer.server.port=5190
      - traefik.http.services.hf-studio-websecure.loadbalancer.server.port=5190
    networks:
      - dokploy-network

volumes:
  # Owned by the MCP compose project; both containers mount it so the Studio
  # sees every project the MCP creates/renders.
  hf-projects:
    external: true
    name: code_hf-mcp-projects

networks:
  dokploy-network:
    external: true